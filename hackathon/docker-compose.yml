version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: techseek-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: techseek
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d techseek"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: techseek-adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: techseek-backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:password123@postgres:5432/techseek
      - JWT_SECRET=super_secret_key_123_change_me_in_prod
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - MCP_SERVER_URL=http://mcp-server:5000
      - UPLOAD_DIR=/app/uploads
    ports:
      - "8000:8000"
    volumes:
      - uploads_volume:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    container_name: techseek-mcp
    restart: always
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - UPLOAD_DIR=/app/uploads
      - DATABASE_URL=postgresql://postgres:password123@postgres:5432/techseek
    ports:
      - "5000:5000"
    volumes:
      - uploads_volume:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: techseek-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  uploads_volume:
